name: Build

on:
  push:
    branches:
      - main
  release:
    types: [published]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build
    runs-on: [windows-latest]

    steps:
      - name: Get latest CMake and ninja
        uses: lukka/get-cmake@latest

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup VS environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and install debug
        run: |
          cmake --preset x64-Debug .
          cmake --build _build/x64-Debug --parallel
          cmake --install _build/x64-Debug

      - name: Build and install release
        run: |
          cmake --preset x64-Release .
          cmake --build _build/x64-Release --parallel
          cmake --install _build/x64-Release

      - name: Copy debug artifacts
        run: |
          mkdir _dist-debug
          Copy-Item _install/x64-Debug/bin/* -Destination _dist-debug/ -Recurse
          Copy-Item LICENSE -Destination _dist-debug/LICENSE

      - name: Copy release artifacts
        run: |
          mkdir _dist-release
          Copy-Item _install/x64-Release/bin/* -Destination _dist-release/ -Recurse
          Copy-Item LICENSE -Destination _dist-release/LICENSE

      - name: Archive debug
        uses: actions/upload-artifact@v4
        with:
          name: VRFoveationFix-Debug
          path: _dist-debug/*

      - name: Archive release
        uses: actions/upload-artifact@v4
        with:
          name: VRFoveationFix-Release
          path: _dist-release/*

  upload_release:
    name: Upload release artifacts
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download debug artifact
        uses: actions/download-artifact@v4
        with:
          name: VRFoveationFix-Debug
          path: VRFoveationFix-Debug

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: VRFoveationFix-Release
          path: VRFoveationFix-Release

      - name: Archive artifact files
        run: |
          cd VRFoveationFix-Debug
          zip -r VRFoveationFix-Debug.zip *
          cd ../VRFoveationFix-Release
          zip -r VRFoveationFix-Release.zip *

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          VRFoveationFix-Debug/VRFoveationFix-Debug.zip
          VRFoveationFix-Release/VRFoveationFix-Release.zip
          --repo "${{ github.repository }}"
